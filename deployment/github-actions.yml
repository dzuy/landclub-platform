name: Land Club checks
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landclub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: landclub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://landclub:ci-only-password@localhost:5432/landclub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify deployment image
        run: docker build -t land-club:ci .
      - name: Verify packaged migrations and content on PostgreSQL
        run: >-
          docker run --rm --network host
          -e DATABASE_URL="$TEST_DATABASE_URL"
          -e SEED_DEMO_CONTENT=true
          land-club:ci sh -c 'node scripts/migrate.mjs && node scripts/seed-demo.mjs'
      - name: Verify production HTTP and staff gate
        shell: bash
        run: |
          docker run -d --name land-club-smoke --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e SUPABASE_URL=https://unused.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=ci-placeholder \
            -e STAFF_USER_IDS=00000000-0000-0000-0000-000000000001 \
            land-club:ci
          trap 'docker logs land-club-smoke; docker rm -f land-club-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent http://127.0.0.1:3000/ --output /tmp/land-club-home
          grep -q 'Find your' /tmp/land-club-home
          curl --silent --dump-header /tmp/staff-headers --output /dev/null http://127.0.0.1:3000/staff/properties
          grep -qi 'location: /signin' /tmp/staff-headers
